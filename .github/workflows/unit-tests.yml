name: Learning and evidence interfaces
on: [push, pull_request, workflow_dispatch]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy scikit-learn pytest matplotlib Markdown
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_sequence_v4.py tests/test_acquisition_evidence.py -q
        env:
          PYTHONPATH: src
